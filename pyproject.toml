[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-data-selection"
version = "0.1.0"
description = "Reproducible COCO data preparation for image-text retrieval experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = [
  "numpy>=1.26",
  "pillow>=10.0",
  "torch>=2.3",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
vlm-data = "vlm_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
