[workspace]
name = "vlm-data-selection-visual"
version = "0.1.0"
description = "Reproducible frozen-OpenCLIP embedding and GPU FAISS environment"
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
numpy = "1.26.4.*"
pytorch = { version = "2.5.1.*", build = "py3.11_cuda12.4*" }
torchvision = { version = "0.20.1.*", build = "py311_cu124" }
pytorch-cuda = "12.4.*"
cuda-version = "12.4.*"
faiss-gpu = { version = "1.12.0.*", build = "py3.11_*_cuda12.4.0" }
pytest = ">=8,<9"
ruff = ">=0.8,<1"

[pypi-dependencies]
open-clip-torch = "==3.3.0"
sentence-transformers = "==3.4.1"
transformers = "==4.46.3"
nltk = "==3.9.1"

[tasks]
test = { cmd = "python -m unittest discover -s tests -v", env = { PYTHONPATH = "src" } }
lint = "ruff check --select E4,E7,E9,F src tests"
visual-stack-smoke = { cmd = [
  "python",
  "-c",
  "import faiss, open_clip, torch; assert torch.cuda.is_available(), 'CUDA unavailable'; assert torch.cuda.get_device_capability() == (7, 5), torch.cuda.get_device_capability(); assert faiss.get_num_gpus() >= 1, 'FAISS GPU unavailable'; print({'torch': torch.__version__, 'cuda': torch.version.cuda, 'device': torch.cuda.get_device_name(0), 'faiss_gpus': faiss.get_num_gpus(), 'open_clip': open_clip.__version__})",
] }
